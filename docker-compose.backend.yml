version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: apocalipse_db
    environment:
      POSTGRES_DB: ${DB_NAME:-apocalipse_pesqueiro}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prosperitylake}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-apocalipse_pesqueiro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apocalipse_network

  # Backend Socket.IO Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: apocalipse_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      # Node environment
      NODE_ENV: production
      
      # Socket.IO configuration
      SOCKET_PORT: ${SOCKET_PORT:-3005}
      
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-apocalipse_pesqueiro}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-prosperitylake}
    volumes:
      # Mount logs directory for persistence
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - apocalipse_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  apocalipse_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
